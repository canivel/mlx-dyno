[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlxserve"
version = "0.1.0"
description = "MLX inference server for Apple Silicon with accurate, exportable generation metrics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mlx", "apple-silicon", "llm", "inference", "server", "metrics", "prometheus"]
dependencies = ["mlx-lm>=0.28"]

[project.urls]
Homepage = "https://github.com/canivel/mlx-serve"

[project.scripts]
mlxserve = "mlxserve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlxserve"]
